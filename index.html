<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재외학교 시간표 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 제목 줄 + 단계 탭 + 한 화면 작업 영역. 칠판 녹색을 포인트로 한 차분한 업무용 도구 */
:root {
  --bg: #f3f5f4;
  --panel: #ffffff;
  --ink: #1b2a2e;
  --muted: #5b6a6f;
  --line: #d8e0de;
  --accent: #1f6f5c;
  --accent-ink: #ffffff;
  --accent-soft: #e0efea;
  --warn: #9a5b00;
  --warn-bg: #fff3dc;
  --err: #a8261d;
  --err-bg: #fde8e6;
  --ok: #2c6e3f;
  --ok-bg: #e5f3e8;
  --c-split: #d9e7f8; --c-split-ink: #173b66;
  --c-special: #fbe4cc; --c-special-ink: #6a3a07;
  --c-fixed: #e6dcf8; --c-fixed-ink: #3f2670;
  --c-home: #ffffff; --c-home-ink: #1b2a2e;
  --c-empty: #f0f2f1;
  --font: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191b; --panel: #1a2326; --ink: #e5eceb; --muted: #9db0b3; --line: #2e3d41;
    --accent: #4fb89d; --accent-ink: #0b1b17; --accent-soft: #1e3a33;
    --warn: #f0b45a; --warn-bg: #3a2c12; --err: #ff8f86; --err-bg: #3d1d1b; --ok: #7fd18f; --ok-bg: #1b3524;
    --c-split: #1f3a5c; --c-split-ink: #cfe2fb; --c-special: #55371a; --c-special-ink: #f8dcbd;
    --c-fixed: #392d5c; --c-fixed-ink: #e1d6fa; --c-home: #1a2326; --c-home-ink: #e5eceb; --c-empty: #222d30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191b; --panel: #1a2326; --ink: #e5eceb; --muted: #9db0b3; --line: #2e3d41;
  --accent: #4fb89d; --accent-ink: #0b1b17; --accent-soft: #1e3a33;
  --warn: #f0b45a; --warn-bg: #3a2c12; --err: #ff8f86; --err-bg: #3d1d1b; --ok: #7fd18f; --ok-bg: #1b3524;
  --c-split: #1f3a5c; --c-split-ink: #cfe2fb; --c-special: #55371a; --c-special-ink: #f8dcbd;
  --c-fixed: #392d5c; --c-fixed-ink: #e1d6fa; --c-home: #1a2326; --c-home-ink: #e5eceb; --c-empty: #222d30;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body { min-height: 100%; }
button, input, select { font: inherit; color: inherit; }
.app > *, #view, .card, .row > * { min-width: 0; }
.app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
header.top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
header.top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.school { color: var(--muted); font-size: 14px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); padding-bottom: 0; }
nav.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; border-radius: 6px 6px 0 0; }
nav.tabs button:hover { color: var(--ink); background: var(--accent-soft); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
nav.tabs .n { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 10px; font-size: 12px; margin-right: 6px; background: var(--line); color: var(--ink); }
nav.tabs button[aria-selected="true"] .n { background: var(--accent); color: var(--accent-ink); }
nav.tabs .badge { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 10px; font-size: 12px; line-height: 18px; background: var(--err); color: #fff; }
nav.tabs .badge.w { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
button:focus-visible, input:focus-visible, select:focus-visible, td.click:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 17px; }
.card h3 { margin: 0; font-size: 15px; }
.card p.help, .help { margin: 0; color: var(--muted); font-size: 13.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.f input, label.f select { color: var(--ink); }
input[type=text], input[type=number], input:not([type]), select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.btn.armed { border-color: var(--err); color: var(--err); background: var(--err-bg); }
.btn[disabled] { opacity: .55; cursor: wait; }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.grid { border-collapse: collapse; width: 100%; }
table.grid th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 7px 10px; background: var(--bg); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
table.grid td input, table.grid td select { width: 100%; border-color: transparent; background: transparent; padding: 5px 6px; }
table.grid td input:hover, table.grid td select:hover { border-color: var(--line); }
table.grid td input:focus, table.grid td select:focus { background: var(--panel); border-color: var(--accent); }
table.grid td.x { width: 34px; text-align: center; }
table.grid td.x button { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
table.grid td.x button:hover { color: var(--err); background: var(--err-bg); }
.issues { display: flex; flex-direction: column; gap: 6px; }
.issue { padding: 7px 10px; border-radius: 6px; font-size: 14px; display: flex; gap: 8px; }
.issue.err { background: var(--err-bg); color: var(--err); }
.issue.warn { background: var(--warn-bg); color: var(--warn); }
.issue.ok { background: var(--ok-bg); color: var(--ok); }
.issue b { flex: none; min-width: 34px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12.5px; background: var(--line); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.over > i { background: var(--err); }
.stat { display: flex; gap: 20px; flex-wrap: wrap; }
.stat div { display: flex; flex-direction: column; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 3px 11px; cursor: pointer; font-size: 13.5px; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tt-wrap { overflow-x: auto; }
table.tt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; table-layout: fixed; }
table.tt th { background: var(--bg); font-weight: 600; padding: 6px; border: 1px solid var(--line); font-size: 13.5px; }
table.tt td { border: 1px solid var(--line); padding: 5px 6px; vertical-align: top; height: 52px; font-size: 14px; position: relative; }
table.tt td .m { font-weight: 700; }
table.tt td .s { display: block; font-size: 11.5px; line-height: 1.35; opacity: .9; }
table.tt td.k-split { background: var(--c-split); color: var(--c-split-ink); }
table.tt td.k-special { background: var(--c-special); color: var(--c-special-ink); }
table.tt td.k-fixed { background: var(--c-fixed); color: var(--c-fixed-ink); }
table.tt td.k-home { background: var(--c-home); color: var(--c-home-ink); }
table.tt td.k-empty { background: repeating-linear-gradient(135deg, var(--c-empty), var(--c-empty) 6px, transparent 6px, transparent 12px); }
table.tt td.bad { box-shadow: inset 0 0 0 2px var(--err); }
table.tt td.click { cursor: pointer; }
table.tt td.click:hover { filter: brightness(0.96); }
table.tt td .lock { position: absolute; right: 3px; top: 2px; font-size: 10.5px; font-weight: 700; background: var(--ink); color: var(--panel); padding: 0 4px; border-radius: 3px; }
table.tt th.per { width: 46px; }
table.all { border-collapse: separate; border-spacing: 0; font-size: 11.5px; }
table.all th, table.all td { border: 1px solid var(--line); padding: 2px 3px; text-align: center; white-space: nowrap; min-width: 30px; }
table.all th { background: var(--bg); font-weight: 600; }
table.all th.lab, table.all td.lab { position: sticky; left: 0; background: var(--panel); text-align: left; min-width: 74px; z-index: 1; font-weight: 600; }
table.all tr.sep td { border: 0; height: 8px; background: transparent; }
table.all td.dstart, table.all th.dstart { border-left: 2px solid var(--ink); }
table.all td.k-split { background: var(--c-split); color: var(--c-split-ink); }
table.all td.k-special { background: var(--c-special); color: var(--c-special-ink); }
table.all td.k-fixed { background: var(--c-fixed); color: var(--c-fixed-ink); }
table.all td.k-home { background: var(--c-home); }
table.all td.k-empty { background: var(--c-empty); }
table.all td.bad { box-shadow: inset 0 0 0 2px var(--err); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: 90vw; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
details.tool { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
details.tool summary { cursor: pointer; font-weight: 600; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0; }
.checks label { display: flex; gap: 5px; align-items: center; font-size: 14px; }
table.plain { border-collapse: collapse; width: 100%; font-size: 14px; }
table.plain th, table.plain td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.plain th { color: var(--muted); font-size: 12.5px; font-weight: 600; }
table.plain td.num, table.plain th.num { text-align: right; }
@media (max-width: 520px) { header.top h1 { font-size: 20px; } .app { padding: 14px 12px 40px; } }

.subjbox { min-width: 280px; }
.subjbox .kl { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 4px 10px; }
label.chk { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; cursor: pointer; }
label.chk input { width: auto; margin: 0; }
label.chk.split { color: var(--accent); font-weight: 600; }

.hdr-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hist { display: flex; gap: 6px; }
.hist .btn:disabled { opacity: .45; cursor: default; }

table.grid td input::placeholder { color: var(--muted); opacity: .5; font-style: italic; }
table.grid td label.chk input { width: 16px; height: 16px; flex: none; padding: 0; border: 0; }
label.chk { white-space: nowrap; }
.subjbox { min-width: 360px; }
.chips2 { gap: 6px 14px; }
.blkcell { min-width: 190px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.blkpick { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel); }
.bgrid { display: grid; grid-template-columns: 48px repeat(5, 34px); gap: 3px; align-items: center; font-size: 12px; }
.bgrid b { font-weight: 600; color: var(--muted); text-align: center; }
.bc { height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg, #fff); cursor: pointer; padding: 0; color: #fff; font-size: 12px; }
.bc.on { background: #b91c1c; border-color: #b91c1c; }
.bc:disabled { opacity: .25; cursor: default; }

.vdet { margin: 4px 0 8px; } .vdet summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.vault { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.vlist { display: flex; flex-direction: column; gap: 4px; }
.vitem { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }

td.mv { white-space: nowrap; padding: 0 2px; width: 54px; }
td.mv button { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; font-size: 10px; width: 22px; height: 22px; cursor: pointer; padding: 0; line-height: 1; }
td.mv button:disabled { opacity: .3; cursor: default; }
.movebar { display: flex; flex-direction: column; gap: 6px; }
table.tt td.picked { outline: 3px solid var(--accent); outline-offset: -3px; }
table.tt td.hint-ok { box-shadow: inset 0 0 0 3px #16a34a; cursor: pointer; }
table.tt td.hint-risk { box-shadow: inset 0 0 0 3px #d97706; cursor: pointer; }
table.tt td.hint-no { opacity: .4; cursor: not-allowed; }
table.tt td.moved { position: relative; }
table.tt td.moved::after { content: '↔'; position: absolute; top: 2px; right: 4px; font-size: 11px; color: var(--accent); font-weight: 700; }
.issue.ok { border-left-color: #16a34a; }
.movebar .issue ul { margin: 4px 0 4px 18px; padding: 0; }
.movebar .issue { flex-direction: column; gap: 4px; }
td.x { white-space: nowrap; } td.x .cp { margin-right: 4px; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }

.combo { display: flex; flex-wrap: wrap; gap: 8px; }
.combo label.cb { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; min-width: 110px; }
.combo label.cb select { font-size: 14px; }
.combo { flex-wrap: nowrap; min-width: 340px; }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>재외학교 시간표 도우미</h1>
      <p>7·8교시, 분반 수업, 중국어 같은 특수 과목이 있는 재외한국학교용 초등 시간표 자동 배정</p>
    </div>
    <div class="hdr-r"><div class="school" id="school"></div><div class="hist" id="hist"></div></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="작업 단계"></nav>
  <main id="view"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* 재외한국학교 시간표 배정 로직 (브라우저/Node 공용) */
(function (root) {
'use strict';

const DAYS = ['월', '화', '수', '목', '금'];
const KINDS = ['담임', '분반', '전담', '고정'];
const TYPES = ['담임', '교과전담', '원어민', '강사', '중등교사'];

function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const splitList = s => String(s == null ? '' : s).split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean);
const normGroup = g => { const s = String(g == null ? '' : g).trim(); return (s === '' || s === '-' || s === '전체') ? '-' : s; };

function parseSlots(str) {
  const out = []; const re = /([월화수목금])\s*(\d+)(?:\s*[-~]\s*(\d+))?/g; let m;
  str = String(str == null ? '' : str);
  while ((m = re.exec(str))) {
    const d = DAYS.indexOf(m[1]); const a = parseInt(m[2]); const b = m[3] ? parseInt(m[3]) : a;
    for (let p = Math.min(a, b); p <= Math.max(a, b); p++) out.push({ d, p: p - 1 });
  }
  return out;
}

function expandTarget(str, classes, cIdx) {
  const s = String(str == null ? '' : str).trim();
  if (!s || s === '전체') return classes.map(c => c.ci);
  const res = new Set();
  s.split(/[,，、\s]+/).filter(Boolean).forEach(part => {
    if (/^[1-6]$/.test(part)) classes.filter(c => c.grade === +part).forEach(c => res.add(c.ci));
    else if (/^[1-6]-\d+$/.test(part)) { if (cIdx[part] !== undefined) res.add(cIdx[part]); }
    else if (/^[1-6]학년$/.test(part)) classes.filter(c => c.grade === parseInt(part)).forEach(c => res.add(c.ci));
  });
  return [...res];
}
function targetSpecificity(str) {
  const s = String(str == null ? '' : str).trim();
  if (!s || s === '전체') return 1;
  if (/-/.test(s)) return 3;
  return 2;
}

function parseAvail(str, MAXP, morning) {
  const s = String(str == null ? '' : str).trim(); if (!s) return null;
  const allow = new Uint8Array(5 * MAXP); let ok = false, bad = false;
  s.split(/[,，、;\/]+/).map(x => x.trim()).filter(Boolean).forEach(cl => {
    const days = new Set(); const dr = /([월화수목금])\s*[-~]\s*([월화수목금])/g; let m;
    while ((m = dr.exec(cl))) { const a = DAYS.indexOf(m[1]), b = DAYS.indexOf(m[2]); for (let d = Math.min(a, b); d <= Math.max(a, b); d++) days.add(d); }
    const rest = cl.replace(dr, ' ');
    for (const ch of rest) { const d = DAYS.indexOf(ch); if (d >= 0) days.add(d); }
    const periods = new Set();
    if (/오전/.test(rest)) for (let p = 0; p < morning; p++) periods.add(p);
    if (/오후/.test(rest)) for (let p = morning; p < MAXP; p++) periods.add(p);
    const pr = /(\d+)\s*(?:[-~]\s*(\d+))?/g; let pm; const nd = rest.replace(/[월화수목금]/g, ' ');
    while ((pm = pr.exec(nd))) { const a = +pm[1], b = pm[2] ? +pm[2] : a; for (let p = Math.min(a, b); p <= Math.max(a, b); p++) periods.add(p - 1); }
    const left = cl.replace(/[월화수목금]/g, '').replace(/오전|오후|요일|만|까지|부터|이후|이전/g, '').replace(/[\d\s\-~]/g, '');
    if (left) bad = true;
    if (!days.size && !periods.size) return;
    ok = true; if (!days.size) for (let d = 0; d < 5; d++) days.add(d); if (!periods.size) for (let p = 0; p < MAXP; p++) periods.add(p);
    days.forEach(d => periods.forEach(p => { if (p >= 0 && p < MAXP) allow[d * MAXP + p] = 1; }));
  });
  return (ok && !bad) ? allow : null;
}
const isManual = r => !!String(r.teacher || '').trim() && (r.mode === '수동' || r.mode == null || r.mode === '');
const sideOf = t => (t.type === '원어민' ? 'N' : 'K');

function emptyModel() {
  return {
    meta: { school: '', year: '', term: '' },
    periods: [7, 7, 7, 7, 7], morning: 4,
    classCounts: [1, 1, 1, 1, 1, 1],
    subjects: [], groups: [], ratio: [], teachers: [],
    splitAssign: [], specialAssign: [], fixed: [], combos: []
  };
}

/* ───────── 모델 → 계산용 구조 ───────── */
function compile(model) {
  const issues = [];
  const W = m => issues.push({ level: 'warn', msg: m });
  const E = m => issues.push({ level: 'err', msg: m });
  const D = 5;
  const periods = (model.periods || [7, 7, 7, 7, 7]).map(n => Math.max(0, Math.min(12, parseInt(n) || 0)));
  const MAXP = Math.max(1, ...periods);
  const S = D * MAXP;
  const valid = new Uint8Array(S);
  for (let d = 0; d < D; d++) for (let p = 0; p < periods[d]; p++) valid[d * MAXP + p] = 1;
  const slotsTotal = valid.reduce((a, b) => a + b, 0);

  const classes = []; const cIdx = {};
  (model.classCounts || []).forEach((n, gi) => {
    for (let i = 1; i <= (parseInt(n) || 0); i++) {
      const key = (gi + 1) + '-' + i; cIdx[key] = classes.length;
      classes.push({ key, grade: gi + 1, idx: i, hr: -1, ci: classes.length });
    }
  });
  const nC = classes.length;

  const teachers = []; const tIdx = {};
  (model.teachers || []).forEach(t => {
    const name = String(t.name || '').trim(); if (!name) return;
    if (tIdx[name] !== undefined) { W(`교사 이름이 중복됩니다: ${name}`); return; }
    const o = {
      name, type: t.type || '기타',
      max: (t.max === '' || t.max == null || isNaN(Number(t.max))) ? 99 : Number(t.max),
      homeroom: String(t.homeroom || '').trim(), subjects: splitList(t.subjects),
      blocked: new Uint8Array(S), ti: teachers.length
    };
    parseSlots(t.blocked).forEach(({ d, p }) => { if (d < D && p < MAXP) o.blocked[d * MAXP + p] = 1; });
    if (String(t.avail || '').trim()) {
      const al = parseAvail(t.avail, MAXP, parseInt(model.morning) || 4);
      if (!al) W(`${name}: 가능 시간 '${t.avail}'을(를) 읽을 수 없어 무시합니다. (예: 월,수,금 / 오전 / 화 오전)`);
      else for (let i = 0; i < S; i++) if (!al[i]) o.blocked[i] = 1;
    }
    o.free = 0; for (let i = 0; i < S; i++) if (valid[i] && !o.blocked[i]) o.free++;
    tIdx[name] = o.ti; teachers.push(o);
    if (o.homeroom) {
      if (cIdx[o.homeroom] === undefined) W(`${name}: 담임 학급 '${o.homeroom}'이(가) 학급 목록에 없습니다.`);
      else {
        if (classes[cIdx[o.homeroom]].hr >= 0) W(`${o.homeroom}에 담임이 두 명 지정되어 있습니다.`);
        classes[cIdx[o.homeroom]].hr = o.ti;
      }
    }
  });
  const nT = teachers.length;

  const subjects = []; const sIdx = {};
  (model.subjects || []).forEach(s => {
    const name = String(s.name || '').trim(); if (!name) return;
    if (sIdx[name] !== undefined) { W(`과목 이름이 중복됩니다: ${name}`); return; }
    const kind = KINDS.includes(s.kind) ? s.kind : '담임';
    const h = [1, 2, 3, 4, 5, 6].map(g => parseInt(s['g' + g]) || 0);
    const o = {
      name, short: String(s.short || name.slice(0, 1)), kind, h,
      consec: s.consec === '금지' ? '금지' : '허용',
      maxDay: (s.maxDay === '' || s.maxDay == null) ? 0 : (parseInt(s.maxDay) || 0), si: subjects.length
    };
    sIdx[name] = o.si; subjects.push(o);
  });

  const groupMap = {};
  (model.groups || []).forEach(r => { groupMap[String(r.subject).trim() + '|' + parseInt(r.grade)] = splitList(r.names); });

  /* 고정시간 */
  const baseOcc = new Int16Array(nC * S), hrFlag = new Uint8Array(nC * S), baseT = new Int16Array(Math.max(1, nT) * S);
  const fixedCells = {};
  const pins = {};
  const fixedCount = {}; // `${ci}|${si}` -> count
  (model.fixed || []).forEach((r, ri) => {
    const label = `고정시간 ${ri + 1}번째 줄`;
    if (!r.subject && !r.target && !r.day) return;
    const type = r.type === '동아리' ? '동아리' : '수업';
    const subjName = String(r.subject || '').trim(); const si = sIdx[subjName];
    if (si === undefined) { E(`${label}: 과목 '${subjName}'을(를) 교과시수 표에서 찾을 수 없습니다.`); return; }
    const sub = subjects[si];
    const targets = expandTarget(r.target, classes, cIdx);
    if (!targets.length) { E(`${label}: 대상 '${r.target}'을(를) 학급으로 읽을 수 없습니다. (예: 3-1, 5, 5,6, 전체)`); return; }
    const slots = parseSlots(String(r.day || '') + String(r.period || '')).filter(x => x.d < D && x.p < MAXP && valid[x.d * MAXP + x.p]);
    if (!slots.length) { E(`${label}: 요일·교시를 읽을 수 없습니다. (예: 요일 화, 교시 6 또는 6-7)`); return; }
    const tis = []; const useHr = splitList(r.teachers).includes('담임');
    splitList(r.teachers).forEach(n => { if (n === '담임') return; if (tIdx[n] === undefined) W(`${label}: 교사 '${n}'을(를) 찾을 수 없습니다.`); else tis.push(tIdx[n]); });
    slots.forEach(({ d, p }) => {
      const s = d * MAXP + p;
      if (type !== '동아리' && sub.kind === '분반') {
        targets.forEach(ci => { const k = si + '|' + classes[ci].grade; (pins[k] = pins[k] || new Set()).add(s); });
      } else if (type !== '동아리' && sub.kind === '전담') {
        targets.forEach(ci => { const k = si + '|c' + ci; (pins[k] = pins[k] || new Set()).add(s); });
      } else if (type !== '동아리' && sub.kind === '담임') {
        targets.forEach(ci => { baseOcc[ci * S + s]++; hrFlag[ci * S + s] = 1; fixedCount[ci + '|' + si] = (fixedCount[ci + '|' + si] || 0) + 1; });
      } else {
        const allT = new Set(tis);
        targets.forEach(ci => {
          const tc = tis.slice(); if (useHr && classes[ci].hr >= 0) { tc.push(classes[ci].hr); allT.add(classes[ci].hr); }
          baseOcc[ci * S + s]++; fixedCells[ci * S + s] = { si, tis: tc, type }; fixedCount[ci + '|' + si] = (fixedCount[ci + '|' + si] || 0) + 1;
        });
        allT.forEach(ti => { baseT[ti * S + s]++; });
      }
    });
  });

  for (let ci = 0; ci < nC; ci++) for (let s = 0; s < S; s++) {
    if (baseOcc[ci * S + s] > 1) E(`${classes[ci].key}반 ${DAYS[Math.floor(s / MAXP)]}${(s % MAXP) + 1}교시: 고정시간이 겹칩니다. (고정시간 표를 확인하세요)`);
  }

  /* 수업 묶음(units) */
  const units = [];
  const splitRows = model.splitAssign || [], specRows = model.specialAssign || [];
  subjects.forEach(sub => {
    if (sub.kind === '분반') {
      for (let g = 1; g <= 6; g++) {
        const H = sub.h[g - 1]; if (!H) continue;
        const cl = classes.filter(c => c.grade === g).map(c => c.ci); if (!cl.length) continue;
        let names = groupMap[sub.name + '|' + g]; if (!names || !names.length) names = ['-'];
        const groups = names.map(nm => {
          const rows = splitRows.filter(r => String(r.subject).trim() === sub.name && parseInt(r.grade) === g && normGroup(r.group) === normGroup(nm));
          const tl = [];
          rows.forEach(r => {
            const tn = String(r.teacher || '').trim(); const hrs = parseInt(r.hours) || 0; let ti = -1;
            if (tn) { if (tIdx[tn] === undefined) W(`분반배정: 교사 '${tn}'을(를) 찾을 수 없습니다. (${sub.name} ${g}학년 ${nm})`); else ti = tIdx[tn]; }
            for (let k = 0; k < hrs; k++) tl.push(ti);
          });
          if (tl.length > H) { W(`${sub.name} ${g}학년 ${nm}: 배정 시수(${tl.length})가 수업 시수(${H})보다 커서 초과분은 무시합니다.`); tl.length = H; }
          while (tl.length < H) tl.push(-1);
          return { name: nm, tl };
        });
        units.push({ type: 'split', si: sub.si, sub, grade: g, classes: cl, H, groups, pinned: [...(pins[sub.si + '|' + g] || [])].sort((a, b) => a - b) });
      }
    } else if (sub.kind === '전담') {
      let spIdx = 0; const spPool = teachers.filter(t => t.subjects.includes(sub.name));
      classes.forEach(c => {
        const H = sub.h[c.grade - 1]; if (!H) return;
        const rows = specRows.filter(r => String(r.subject).trim() === sub.name);
        let best = 0, sel = [];
        rows.forEach(r => {
          if (expandTarget(r.target, classes, cIdx).includes(c.ci)) {
            const sp = targetSpecificity(r.target);
            if (sp > best) { best = sp; sel = [r]; } else if (sp === best) sel.push(r);
          }
        });
        const tl = [];
        const names = sel.map(r => String(r.teacher || '').trim()).filter(Boolean);
        names.forEach(n => { if (tIdx[n] === undefined) W(`전담배정: 교사 '${n}'을(를) 찾을 수 없습니다. (${sub.name})`); });
        const ok = names.filter(n => tIdx[n] !== undefined);
        if (ok.length) { for (let k = 0; k < H; k++) tl.push(tIdx[ok[k % ok.length]]); }
        else if (spPool.length) { const tt = spPool[spIdx % spPool.length].ti; spIdx++; for (let k = 0; k < H; k++) tl.push(tt); }
        else { for (let k = 0; k < H; k++) tl.push(-1); }
        units.push({ type: 'special', si: sub.si, sub, grade: c.grade, classes: [c.ci], H, groups: [{ name: '-', tl }], pinned: [...(pins[sub.si + '|c' + c.ci] || [])].sort((a, b) => a - b) });
      });
    }
  });
  units.forEach(u => {
    if (u.pinned.length > u.H) { W(`${u.sub.name} ${u.grade}학년: 고정한 시간(${u.pinned.length})이 시수(${u.H})보다 많아 초과분은 무시합니다.`); u.pinned.length = u.H; }
    u.allowed = [];
    for (let s = 0; s < S; s++) {
      if (!valid[s]) continue;
      if (u.classes.every(c => baseOcc[c * S + s] === 0)) u.allowed.push(s);
    }
  });
  // 분반 조합: 같은 시간에 함께 수업하는 교사 조합을 지정 (예: 3A 신유나 + 3B Amy + 3C Ben)
  units.forEach(u => { u.lock = new Uint8Array(u.H); u.comboSlot = new Int16Array(u.H).fill(-1); });
  (model.combos || []).forEach(cb => {
    const sn = String(cb.subject || '').trim(), gr = parseInt(cb.grade); const txt = String(cb.teachers || '').trim(); if (!sn && !txt) return;
    const u = units.find(x => x.type === 'split' && x.sub.name === sn && x.grade === gr);
    if (!u) { W(`조합: ${sn} ${cb.grade}학년 분반 수업을 찾을 수 없어 무시합니다.`); return; }
    const parts = txt.split(/[,，;]/).map(s => s.trim()).filter(Boolean).map(p => { const m = p.match(/^([^:=：]+)[:=：]\s*(.+)$/); return m ? { g: normGroup(m[1].trim()), t: m[2].trim() } : null; });
    if (!parts.length || parts.some(p => !p)) { E(`조합(${sn} ${gr}학년): '${txt}' — "A:신유나, B:Amy, C:Ben"처럼 분반:교사 형태로 적어 주세요.`); return; }
    const moves = []; let ok = true;
    parts.forEach(p => {
      const gi = u.groups.findIndex(g => normGroup(g.name) === p.g); const ti = tIdx[p.t];
      if (gi < 0) { E(`조합(${sn} ${gr}학년): '${p.g}' 분반이 없습니다.`); ok = false; return; }
      if (ti === undefined) { E(`조합(${sn} ${gr}학년): 교사 '${p.t}'을(를) 찾을 수 없습니다.`); ok = false; return; }
      moves.push({ gi, ti, tn: p.t });
    });
    if (!ok) return;
    if (new Set(moves.map(m => m.ti)).size < moves.length) { E(`조합(${sn} ${gr}학년): 같은 교사를 서로 다른 분반에 동시에 넣을 수 없습니다.`); return; }
    let fixSlot = -1;
    if (String(cb.day || '').trim() && String(cb.period || '').trim()) {
      const sl = parseSlots(String(cb.day).trim() + String(cb.period).trim());
      if (sl.length !== 1 || sl[0].d > 4 || sl[0].p >= MAXP) { E(`조합(${sn} ${gr}학년): 요일·교시 '${cb.day}${cb.period}'을(를) 읽을 수 없습니다.`); return; }
      fixSlot = sl[0].d * MAXP + sl[0].p;
      if (!u.allowed.includes(fixSlot)) { E(`조합(${sn} ${gr}학년): ${cb.day}${cb.period}교시에는 이 학년 수업을 넣을 수 없습니다. (그 시간에 다른 고정 수업이 있거나 수업 시간이 아니에요)`); return; }
      if (u.pinned.includes(fixSlot) || u.comboSlot.includes(fixSlot)) { E(`조합(${sn} ${gr}학년): ${cb.day}${cb.period}교시가 다른 고정·조합과 겹칩니다.`); return; }
    }
    const cnt = fixSlot >= 0 ? 1 : Math.max(1, parseInt(cb.count) || 1);
    for (let c = 0; c < cnt; c++) {
      let i = -1;
      if (fixSlot >= 0) { for (let k = u.H - 1; k >= u.pinned.length; k--) if (!u.lock[k]) { i = k; break; } if (i < 0) { E(`조합(${sn} ${gr}학년): 고정한 시간이 수업 시수(${u.H})보다 많습니다.`); break; } }
      else i = u.lock.findIndex(v => !v);
      if (i < 0) { W(`조합(${sn} ${gr}학년): 조합이 시수보다 많아 일부는 무시합니다.`); break; }
      const swaps = [];
      for (const m of moves) {
        const tl = u.groups[m.gi].tl; let j = -1; for (let k = 0; k < tl.length; k++) if (tl[k] === m.ti && !u.lock[k]) { j = k; break; }
        if (j < 0) { (cb.lock ? W : E)(`조합(${sn} ${gr}학년): ${u.groups[m.gi].name}분반의 ${m.tn} 시수가 모자랍니다. ${cb.lock ? '고정한 칸의 교사 조합을 적용하지 못했어요(수동 시수와 달라짐). 칸을 다시 고정해 주세요.' : '[교사 배정]에서 시수를 늘려 주세요.'}`); ok = false; break; }
        swaps.push({ tl, j });
      }
      if (!ok) break;
      swaps.forEach(({ tl, j }) => { const t = tl[i]; tl[i] = tl[j]; tl[j] = t; });
      u.lock[i] = 1; if (fixSlot >= 0) u.comboSlot[i] = fixSlot;
    }
  });
  const events = [];
  units.forEach((u, ui) => { u.ev = []; for (let i = 0; i < u.H; i++) { u.ev.push(events.length); events.push({ u: ui, i, pin: i < u.pinned.length ? u.pinned[i] : (u.comboSlot[i] >= 0 ? u.comboSlot[i] : -1) }); } });

  return { model, issues, D, MAXP, S, periods, valid, slotsTotal, classes, cIdx, nC, teachers, tIdx, nT, subjects, sIdx, units, events,
    baseOcc, hrFlag, baseT, fixedCells, fixedCount, groupMap };
}

/* ───────── 사전 점검 ───────── */
function teacherLoads(P) {
  const loads = P.teachers.map(t => ({ ti: t.ti, name: t.name, split: 0, special: 0, fixed: 0, home: 0, max: t.max, bySub: {} }));
  P.units.forEach(u => u.groups.forEach(g => g.tl.forEach(t => {
    if (t < 0) return;
    if (u.type === 'split') loads[t].split++; else loads[t].special++;
    loads[t].bySub[u.sub.name] = (loads[t].bySub[u.sub.name] || 0) + 1;
  })));
  for (let t = 0; t < P.nT; t++) { let s = 0; for (let i = 0; i < P.S; i++) s += P.baseT[t * P.S + i]; loads[t].fixed = s; }
  P.classes.forEach(c => {
    if (c.hr < 0) return;
    let h = 0; P.subjects.forEach(sub => { if (sub.kind === '담임') h += sub.h[c.grade - 1]; });
    loads[c.hr].home += h;
  });
  loads.forEach(l => { l.total = l.split + l.special + l.fixed + l.home; });
  return loads;
}

function precheck(P) {
  const out = P.issues.slice();
  const W = m => out.push({ level: 'warn', msg: m });
  const E = m => out.push({ level: 'err', msg: m });
  if (!P.nC) { E('학급이 없습니다. 기본 설정에서 학년별 학급 수를 입력하세요.'); return { issues: out, supply: [], loads: [] }; }
  // 학급별 시수 합계
  P.classes.forEach(c => {
    let tot = 0; P.subjects.forEach(s => { tot += s.h[c.grade - 1]; });
    if (tot > P.slotsTotal) E(`${c.key}반 교과 시수 합계(${tot})가 일주일 수업 칸(${P.slotsTotal})보다 많습니다.`);
    else if (tot < P.slotsTotal) W(`${c.key}반 교과 시수 합계가 ${tot}시간이라 ${P.slotsTotal - tot}칸이 빈 시간으로 남습니다.`);
    P.subjects.forEach(s => {
      if (s.kind === '고정' && s.h[c.grade - 1]) {
        const n = P.fixedCount[c.ci + '|' + s.si] || 0;
        if (n < s.h[c.grade - 1]) W(`${c.key}반 ${s.name}: 시수 ${s.h[c.grade - 1]}인데 고정시간은 ${n}건입니다.`);
        if (n > s.h[c.grade - 1]) E(`${c.key}반 ${s.name}: 시수 ${s.h[c.grade - 1]}보다 고정시간(${n}건)이 많습니다.`);
      }
    });
    if (c.hr < 0) W(`${c.key}반에 담임이 지정되지 않았습니다.`);
  });
  // 분반 배정
  const loads = teacherLoads(P);
  const supply = [];
  P.subjects.filter(s => s.kind === '분반').forEach(sub => {
    let need = 0, got = 0;
    P.units.filter(u => u.sub === sub).forEach(u => u.groups.forEach(g => { need += u.H; g.tl.forEach(t => { if (t >= 0) got++; }); }));
    if (!need) return;
    let cap = 0; const pool = P.teachers.filter(t => t.subjects.includes(sub.name));
    pool.forEach(t => { const l = loads[t.ti]; const other = l.total - (l.bySub[sub.name] || 0); cap += Math.max(0, Math.min(t.max, t.free) - other); });
    supply.push({ subject: sub.name, need, assigned: got, capacity: cap, poolSize: pool.length });
    if (cap < need) E(`${sub.name}: 필요한 시수 ${need}시간인데 교사 상한으로 가능한 시수는 ${cap}시간입니다. (${need - cap}시간 부족: 교사 추가 또는 시수 조정 필요)`);
    if (got < need) W(`${sub.name}: 분반 교사 배정이 ${need - got}시간 비어 있습니다. '교사 배정' 탭에서 채우세요.`);
  });
  const noSp = new Set(); P.units.filter(u => u.type === 'special').forEach(u => { if (u.groups[0].tl.some(t => t < 0)) noSp.add(u.sub.name); });
  noSp.forEach(n => E(`${n}: 담당 교사가 없습니다. 교사 탭의 '담당 과목' 칸에 '${n}'을(를) 적은 교사를 추가하세요.`));
  loads.forEach(l => { if (l.total > l.max) E(`${l.name}: 배정 시수 ${l.total}시간이 상한 ${l.max}시간을 넘습니다.`); const fr = P.teachers[l.ti].free; if (l.total > fr) E(`${l.name}: 가능한 시간이 ${fr}칸인데 배정 시수는 ${l.total}시간입니다. (가능 시간·불가 시간 조건 확인)`); });
  // 중복 제거
  const seen = new Set(); const uniq = out.filter(i => { const k = i.level + i.msg; if (seen.has(k)) return false; seen.add(k); return true; });
  return { issues: uniq, supply, loads };
}

/* ───────── 분반 교사 자동 배정 (수동으로 지정한 줄은 그대로 두고 나머지를 채움) ───────── */
function suggestAssign(model, seed) {
  if (seed == null && model.assignSeed != null) seed = model.assignSeed;

      const m = p.match(/^([^:=：]+)[:=：]\s*(.+)$/); if (!m) return; const k = [sn, gr, normGroup(m[1].trim()), m[2].trim()].join('|');
      const o = need.get(k) || { sn, gr, gn: m[1].trim(), tn: m[2].trim(), n: 0 }; o.n += cnt; o.lockOnly = (o.lockOnly !== false) && !!cb.lock; need.set(k, o);

    const gU = P0.units.find(x => x.type === 'split' && x.sub.name === o.sn && x.grade === o.gr);

    const have = manualRows.filter(r => String(r.subject).trim() === o.sn && parseInt(r.grade) === o.gr && normGroup(r.group) === normGroup(o.gn) && String(r.teacher).trim() === o.tn).reduce((s, r) => s + (parseInt(r.hours) || 0), 0);
    if (have < o.n) manualRows.push({ subject: o.sn, grade: o.gr, group: o.gn, teacher: o.tn, hours: o.n - have, mode: '수동', fromCombo: true });

  const capOf = t => Math.min(t.max, t.free);
  const rows = [];
  const ratioFor = (subj, g) => (model.ratio || []).find(r => String(r.subject).trim() === subj && normGroup(r.group) === normGroup(g));
  P.subjects.filter(s => s.kind === '분반').forEach(sub => {

    const demands = [];

    });
    P.units.filter(u => u.sub === sub).forEach(u => u.groups.forEach(g => {

      const mK = g.tl.filter(t => t >= 0 && sideOf(P.teachers[t]) === 'K').length, mN = have - mK;
      const r = ratioFor(sub.name, g.name); const k = r ? (parseInt(r.k) || 0) : 0, n = r ? (parseInt(r.n) || 0) : 0;
      if (r && k + n > 0) {
        const kh = Math.round(u.H * k / (k + n)), nh = u.H - kh;
        let kr = Math.max(0, kh - mK), nr = Math.max(0, nh - mN), sum = kr + nr;

        while (sum < rem) { if (kh >= nh) kr++; else nr++; sum++; }

      } else demands.push({ u, g, type: '*', rem });
    }));
    demands.sort((a, b) => b.rem - a.rem || (rnd ? rnd() - 0.5 : 0) || a.u.grade - b.u.grade);
    const acc = {};
    const add = (d, ti, h) => { const k = d.u.grade + '|' + d.g.name + '|' + ti; acc[k] = (acc[k] || 0) + h; load[ti] += h; used.get(d.u).set(ti, uh(d.u, ti) + h); d.rem -= h; };
    const room = (d, t) => Math.min(capOf(P.teachers[t.ti]) - load[t.ti], d.u.H - uh(d.u, t.ti));

        const nz = {}; pool.forEach(t => { nz[t.ti] = noise(); });

          .sort((a, b) => ((uh(d.u, a.ti) > 0 ? 1 : 0) - (uh(d.u, b.ti) > 0 ? 1 : 0)) || ((capOf(P.teachers[b.ti]) - load[b.ti] + nz[b.ti]) - (capOf(P.teachers[a.ti]) - load[a.ti] + nz[a.ti])) || a.ti - b.ti);

    demands.forEach(d => { if (d.type === '*') alloc(d, '*'); });
    demands.forEach(d => { if (d.rem > 0) alloc(d, '*'); });
    demands.forEach(d => { if (d.rem > 0) acc[d.u.grade + '|' + d.g.name + '|-1'] = (acc[d.u.grade + '|' + d.g.name + '|-1'] || 0) + d.rem; });
    // ── 개선: 그리디 결과를 시작점으로, 교사 시수를 지키면서 분반 조합을 다듬는다 ──
    const gmap = new Map(); const gl = [];

      const key = u.grade + '|' + g.name; const have = g.tl.filter(t => t >= 0).length; const rem0 = u.H - have; if (rem0 <= 0) return;
      const r = ratioFor(sub.name, g.name); const k = r ? (parseInt(r.k) || 0) : 0, n = r ? (parseInt(r.n) || 0) : 0;

    }));

    if (gl.length) {
      const R = rng(seed == null ? 20260101 : seed);
      const ut = new Map(); // unit -> Map(ti -> 시수)
      P.units.filter(u => u.sub === sub).forEach(u => { ut.set(u, new Map(used.get(u))); });
      const gcost = o => {
        let c = o.un * 1000; let kc = 0, nc = 0, kHrs = 0, singles = 0;
        const seenT = new Set();
        o.man.forEach(t => { if (!seenT.has(t)) { seenT.add(t); if (sideOf(P.teachers[t]) === 'K') kc++; else nc++; } if (sideOf(P.teachers[t]) === 'K') kHrs++; });
        o.x.forEach((h, t) => { if (h <= 0) return; if (!seenT.has(t)) { seenT.add(t); if (sideOf(P.teachers[t]) === 'K') kc++; else nc++; } if (sideOf(P.teachers[t]) === 'K') kHrs += h; if (h === 1 && !o.man.includes(t)) singles++; });
        if (o.kh != null) c += Math.abs(kHrs - o.kh) * 30;
        c += (Math.max(0, kc - 1) + Math.max(0, nc - 1)) * 25 + singles * 8;
        return c;
      };
      const mv = (o, from, to, m) => { // from -1 = 미배정
        if (from >= 0) { const h = o.x.get(from) - m; if (h > 0) o.x.set(from, h); else o.x.delete(from); load[from] -= m; const mp = ut.get(o.u); mp.set(from, (mp.get(from) || 0) - m); } else o.un -= m;
        if (to >= 0) { o.x.set(to, (o.x.get(to) || 0) + m); load[to] += m; const mp = ut.get(o.u); mp.set(to, (mp.get(to) || 0) + m); } else o.un += m;
      };

function generate(model, opts) {
  opts = opts || {};
  const P = compile(model);
  const t0 = Date.now();
  const budget = opts.timeMs || 4000;
  const { S, MAXP, nC, nT, units, events, baseOcc, baseT, hrFlag, valid, classes, teachers } = P;
  const nE = events.length;

  const hrClasses = classes.filter(c => c.hr >= 0);

  function newState(rand) {
    const slot = new Int16Array(nE).fill(-1);
    const tls = units.map(u => u.groups.map(g => Int16Array.from(g.tl)));
    tls.forEach((gs, ui) => { const fr = []; for (let i = 0; i < units[ui].H; i++) if (!units[ui].lock[i]) fr.push(i); gs.forEach(a => { for (let k = fr.length - 1; k > 0; k--) { const j = Math.floor(rand() * (k + 1)); const x = a[fr[k]]; a[fr[k]] = a[fr[j]]; a[fr[j]] = x; } }); });
    events.forEach((ev, e) => { if (ev.pin >= 0) slot[e] = ev.pin; });
    tls.forEach((gs, ui) => {
      if (gs.length < 2) return; const H = units[ui].H;
      const dup = () => { let n = 0; for (let i = 0; i < H; i++) { const seen = new Set(); for (let g = 0; g < gs.length; g++) { const t = gs[g][i]; if (t < 0) continue; if (seen.has(t)) n++; seen.add(t); } } return n; };
      let cur = dup();
      for (let it = 0; it < 600 && cur > 0; it++) {
        const g = Math.floor(rand() * gs.length), i = Math.floor(rand() * H), j = Math.floor(rand() * H); if (gs[g][i] === gs[g][j] || units[ui].lock[i] || units[ui].lock[j]) continue;
        const x = gs[g][i]; gs[g][i] = gs[g][j]; gs[g][j] = x; const c2 = dup();
        if (c2 <= cur) cur = c2; else { gs[g][j] = gs[g][i]; gs[g][i] = x; }

  function evalAll(st, active, w) {

    for (let e = 0; e < nE; e++) {

    for (let k = 0; k < hrClasses.length; k++) {

    }

        if (c2 <= cur || rand() < Math.exp((cur - c2) / T)) { cur = c2; sinceRefresh += 10; } else { st.slot[e1] = s1; st.slot[e2] = s2; }
      } else if (swapUnits.length) {
        let ui = swapUnits[Math.floor(rand() * swapUnits.length)]; let ei = -1;
        if (confl.length && rand() < 0.6) { const e0 = confl[Math.floor(rand() * confl.length)]; if (swapSet[events[e0].u]) { ui = events[e0].u; ei = events[e0].i; } }
        const u = units[ui];
        const gi = Math.floor(rand() * u.groups.length); const a = st.tls[ui][gi];
        const i = ei >= 0 ? ei : Math.floor(rand() * a.length), j = Math.floor(rand() * a.length); if (a[i] === a[j]) continue;
        if (!active[u.ev[i]] || !active[u.ev[j]] || u.lock[i] || u.lock[j]) continue;

        if (c2 <= cur || rand() < Math.exp((cur - c2) / T)) { cur = c2; sinceRefresh += 10; } else { a[j] = a[i]; a[i] = x; }

  /* 분반 한 단위(예: 3학년 영어)를 정확하게 다시 짠다: 다른 수업은 그대로 두고,

/* ───────── 담임 수업 채우기 + 결과 정리 + 검증 ───────── */
function finalize(P, st, rand) {

  // 고정 칸
  Object.keys(P.fixedCells).forEach(k => {
    const idx = +k; const ci = Math.floor(idx / S), s = idx % S; const [d, p] = at(s); const f = P.fixedCells[k]; const sub = subjects[f.si];
    if (cells[ci][d][p]) { E(`${classes[ci].key}반 ${slotName(s)}: 고정시간이 겹칩니다.`); return; }
    cells[ci][d][p] = { k: 'fixed', si: f.si, short: sub.short, name: sub.name, teachers: f.tis.map(t => teachers[t].name), club: f.type === '동아리' };
  });
  Object.keys(P.fixedCells).forEach(k => {
    const idx = +k; const ci = Math.floor(idx / S), s = idx % S; const [d, p] = at(s); const f = P.fixedCells[k]; const sub = subjects[f.si];
    f.tis.forEach(t => { const arr = tcells[t][d][p]; const txt = sub.short + (f.type === '동아리' ? '' : ' ' + classes[ci].key); if (f.type === '동아리') { if (!arr.some(x => x.si === f.si)) arr.push({ si: f.si, text: sub.short, k: 'fixed' }); } else arr.push({ si: f.si, text: txt, k: 'fixed' }); });
  });

  events.forEach((ev, e) => {
    const u = units[ev.u]; const s = st.slot[e]; if (s < 0) return; const [d, p] = at(s);
    const groups = u.groups.map((g, gi) => ({ name: g.name, t: st.tls[ev.u][gi][ev.i] }));
    const pinned = ev.pin >= 0;
    u.classes.forEach(ci => {

      for (let i = 0; i < Math.max(0, sb.h[c.grade - 1] - pinned); i++) toks.push(sb.si);
    });

  const seen = new Set(); const uniq = issues.filter(i => { const k = i.level + i.msg; if (seen.has(k)) return false; seen.add(k); return true; });

/* ───────── 수동 이동: 결과표 다시 검증 + 칸 교체 ───────── */
function revalidate(model, res, Pin) {
  const P = Pin || compile(model); const { MAXP, classes, teachers, subjects } = P;
  if (!res || !res.cells || classes.length !== res.cells.length || classes.some((c, i) => !res.classes[i] || c.key !== res.classes[i].key) || res.MAXP !== MAXP) return null;
  const tIdx = {}; teachers.forEach(t => { tIdx[t.name] = t.ti; });
  const tcells = teachers.map(() => Array.from({ length: 5 }, () => Array.from({ length: MAXP }, () => [])));
  const issues = []; const bad = new Set();
  const E = m => issues.push({ level: 'err', msg: m }), W = m => issues.push({ level: 'warn', msg: m });
  const sn = (d, p) => DAYS[d] + (p + 1) + '교시';
  const units = {}; const seen = {}; const unassigned = {};
  classes.forEach(c => {
    for (let d = 0; d < 5; d++) for (let p = 0; p < MAXP; p++) {
      if (p >= P.periods[d]) continue;
      const cell = res.cells[c.ci][d][p]; if (!cell) continue; const ck = c.key + '|' + DAYS[d] + (p + 1);
      if (cell.k === 'home') { if (c.hr >= 0) tcells[c.hr][d][p].push({ si: cell.si, text: cell.short, k: 'home', cks: [ck] }); }
      else if (cell.k === 'fixed') {
        (cell.teachers || []).forEach(n => { const ti = tIdx[n]; if (ti == null) return; const arr = tcells[ti][d][p];
          if (cell.club) { const ex = arr.find(x => x.si === cell.si && x.k === 'fixed'); if (ex) ex.cks.push(ck); else arr.push({ si: cell.si, text: cell.short, k: 'fixed', cks: [ck] }); }
          else arr.push({ si: cell.si, text: cell.short + ' ' + c.key, k: 'fixed', cks: [ck] }); });
      } else if (cell.k === 'split' || cell.k === 'special') {
        const uk = cell.k === 'split' ? 'S|' + cell.unit : 'P|' + c.ci + '|' + cell.si;
        const U = units[uk] || (units[uk] = { cell, slots: [], grade: cell.grade, ci: c.ci }); const sk = uk + '|' + d + '|' + p;
        if (!seen[sk]) { seen[sk] = 1; U.slots.push({ d, p, cks: [ck] }); } else U.slots.find(x => x.d === d && x.p === p).cks.push(ck);
        (cell.groups || []).forEach(g => {
          if (!g.teacher) { if (cell.k === 'split' && !seen['u' + sk + g.name]) { seen['u' + sk + g.name] = 1; const k = `${cell.name} ${cell.grade}학년${g.name === '-' ? '' : ' ' + g.name + '분반'}`; unassigned[k] = (unassigned[k] || 0) + 1; } return; }
          const ti = tIdx[g.teacher]; if (ti == null) return; const gk = 'g' + sk + '|' + g.name;
          const label = cell.k === 'split' ? cell.grade + (g.name === '-' ? '' : g.name) : c.key;
          if (seen[gk] && cell.k === 'split') { const ex = tcells[ti][d][p].find(x => x.gk === gk); if (ex) ex.cks.push(ck); return; }
          seen[gk] = 1; tcells[ti][d][p].push({ si: cell.si, text: cell.short + ' ' + label, k: cell.k, cks: [ck], gk });
        });
      }
    }
  });
  teachers.forEach(t => {
    for (let d = 0; d < 5; d++) for (let p = 0; p < MAXP; p++) {
      const arr = tcells[t.ti][d][p]; if (!arr.length) continue;
      const mark = () => { bad.add(t.name + '|' + DAYS[d] + (p + 1)); arr.forEach(x => x.cks.forEach(k => bad.add(k))); };
      if (arr.length > 1) { E(`${t.name}: ${sn(d, p)}에 수업이 겹칩니다 (${arr.map(x => x.text).join(', ')}). 한 교사가 같은 시간에 두 수업을 할 수 없어요. 다른 칸과 바꾸거나 이동을 취소하세요.`); mark(); }
      if (t.blocked[d * MAXP + p] === 1) {
        const msg = `${t.name}: ${sn(d, p)}는 불가 시간인데 수업(${arr.map(x => x.text).join(', ')})이 있습니다.`;
        if (arr.every(x => x.k === 'fixed')) W(msg.replace('수업(', '직접 지정한 고정 시간(')); else { E(msg); mark(); }

    const U = units[uk]; const sub = subjects[U.cell.si]; if (!sub) return;
    const who = U.cell.k === 'split' ? U.grade + '학년' : classes[U.ci].key + '반';
    if (sub.consec === '금지') {

        const x = U.slots[a], y = U.slots[b];
        if (x.d === y.d && Math.abs(x.p - y.p) === 1) { E(`${sub.name} ${who}: ${sn(x.d, Math.min(x.p, y.p))}와 ${y.p + 1}교시... 연속으로 배치되었습니다. (연속 금지 설정) 두 수업 중 하나를 다른 요일이나 떨어진 교시로 옮기세요.`.replace(/와 \d교시\.\.\./, '와 다음 교시가')); x.cks.concat(y.cks).forEach(k => bad.add(k)); }
      }

  });

      const cell = res.cells[c.ci][d][p]; if (!cell || p >= P.periods[d]) continue;
      if (cell.k === 'empty') empty++;
      if (c.hr >= 0 && cell.k === 'home' && teachers[c.hr].blocked[d * MAXP + p] === 1) { E(`${c.key}반 ${sn(d, p)}: 담임(${teachers[c.hr].name})이 회의 등으로 불가한 시간인데 담임 수업이 있습니다. 담임이 들어갈 수 있는 칸으로 옮기세요.`); bad.add(c.key + '|' + DAYS[d] + (p + 1)); }
    }

  });
  const loads = teachers.map(t => { let n = 0; for (let d = 0; d < 5; d++) for (let p = 0; p < MAXP; p++) n += tcells[t.ti][d][p].length; return { name: t.name, n, max: t.max, type: t.type }; });
  loads.forEach(l => { if (l.n > l.max) E(`${l.name}: 시수 ${l.n}시간이 상한 ${l.max}시간을 넘습니다.`); });

  const sk = new Set(); const uniq = issues.filter(i => { const k = i.level + i.msg; if (sk.has(k)) return false; sk.add(k); return true; });
  tcells.forEach(tc => tc.forEach(r => r.forEach(a => a.forEach(x => { delete x.gk; }))));
  return { tcells, issues: uniq, loads, bad: [...bad] };
}

function trySwap(model, res, ci, a, b, Pin) {
  const P = Pin || compile(model); const classes = P.classes;
  if (a.d === b.d && a.p === b.p) return { ok: false, msg: '같은 칸이에요.' };
  const ca = res.cells[ci][a.d][a.p], cb = res.cells[ci][b.d][b.p];
  if (!ca || !cb) return { ok: false, msg: '옮길 수 없는 칸이에요.' };
  const g = ca.k === 'split' ? ca.grade : cb.k === 'split' ? cb.grade : null;
  const scope = g == null ? [ci] : classes.filter(c => c.grade === g).map(c => c.ci);
  const nm = (d, p) => DAYS[d] + (p + 1) + '교시';
  for (const k of scope) {
    for (const [pp, other] of [[a, b], [b, a]]) {
      const cell = res.cells[k][pp.d][pp.p];
      if (!cell) return { ok: false, msg: `${classes[k].key}반 ${nm(pp.d, pp.p)}은 옮길 수 없는 칸이에요.` };
      if (cell.k === 'fixed') return { ok: false, msg: `${classes[k].key}반 ${nm(pp.d, pp.p)}은 고정 시간(${cell.name})이라 옮길 수 없어요. 바꾸려면 [고정 시간] 탭에서 수정하세요.` };
      if (cell.pin) return { ok: false, msg: `${classes[k].key}반 ${nm(pp.d, pp.p)}은 고정된 칸이에요(칸 고정 또는 분반 조합으로 시간이 정해진 수업). 잠금이면 [칸 고정] 모드에서 풀 수 있어요.` };
    }
  }
  const cells = res.cells.map(cl => cl.map(r => r.slice()));
  scope.forEach(k => { const x = cells[k][a.d][a.p], y = cells[k][b.d][b.p]; cells[k][a.d][a.p] = Object.assign({}, y, y.k === 'empty' ? {} : { moved: true }); cells[k][b.d][b.p] = Object.assign({}, x, x.k === 'empty' ? {} : { moved: true }); });
  const res2 = Object.assign({}, res, { cells, edited: true });
  const v = revalidate(model, res2, P); if (!v) return { ok: false, msg: '설정이 바뀌어서 이 시간표는 더 옮길 수 없어요. 다시 만들어 주세요.' };
  Object.assign(res2, v);
  const before = new Set((res.issues || []).filter(i => i.level === 'err').map(i => i.msg));
  const added = res2.issues.filter(i => i.level === 'err' && !before.has(i.msg)).map(i => i.msg);
  const after = new Set(res2.issues.filter(i => i.level === 'err').map(i => i.msg));
  const fixed = (res.issues || []).filter(i => i.level === 'err' && !after.has(i.msg)).map(i => i.msg);
  return { ok: true, res: res2, added, fixed, scope: scope.length };
}

  const rowsOf = name => { const ws = wb.Sheets[name]; if (!ws) return null; found++; return XLSX.utils.sheet_to_json(ws, { defval: '' }); };
  const basic = rowsOf('기본설정');
  if (basic) {
    const kv = {}; basic.forEach(r => { kv[String(r['항목']).trim()] = r['값']; });
    m.meta.school = String(kv['학교명'] || ''); m.meta.year = String(kv['학년도'] || ''); m.meta.term = String(kv['학기'] || '');
    DAYS.forEach((d, i) => { const v = parseInt(kv[d + ' 교시수']); if (v >= 0) m.periods[i] = v; });
    { const v = parseInt(kv['오전 교시수']); if (v > 0) m.morning = v; }
    for (let g = 1; g <= 6; g++) { const v = parseInt(kv[g + '학년 학급수']); if (v >= 0) m.classCounts[g - 1] = v; }
  } else notes.push("'기본설정' 시트를 찾지 못해 기본값(월~금 7교시, 학년별 1학급)을 썼습니다.");
  Object.keys(SHEETS).forEach(k => {
    const sh = SHEETS[k]; const rows = rowsOf(sh.name);
    if (!rows) { if (!sh.optional) notes.push(`'${sh.name}' 시트를 찾지 못했습니다.`); return; }
    rows.forEach(r => {
      const o = {}; let any = false;
      sh.cols.forEach(([head, key]) => { const v = toCell(r[head], key); o[key] = v; if (v !== '' && v != null) any = true; });
      if (any) m[k].push(o);
    });
  });
  m.splitAssign = m.splitAssign.filter(r => String(r.teacher || '').trim()).map(r => Object.assign(r, { mode: r.mode === '자동' ? '자동' : '수동' }));
  if (!found) notes.unshift('이 파일에서 시간표 도우미 양식의 시트를 하나도 찾지 못했습니다. 시트 이름을 확인하세요.');
  return { model: m, notes, found };
}

/* 결과 → 엑셀 */
function cellText(c, full) {
  if (!c) return '';
  if (c.k === 'empty') return '';
  if (c.k === 'split' && full) return c.short + ' (' + c.groups.map(g => (g.name === '-' ? '' : g.name + ':') + (g.teacher || '미배정')).join(' / ') + ')';
  if (c.k === 'special' && full && c.groups[0].teacher) return c.short + ' (' + c.groups[0].teacher + ')';
  if (c.k === 'fixed' && full && c.teachers && c.teachers.length) return c.short + ' (' + c.teachers.join(', ') + ')';
  return c.short;
}

function resultToWorkbook(XLSX, res, model) {
  const wb = XLSX.utils.book_new(); const MAXP = res.MAXP;
  const header35 = ['구분'];
  DAYS.forEach((d, di) => { for (let p = 0; p < res.periods[di]; p++) header35.push(d + (p + 1)); });
  // 전체표
  const all = [header35];
  res.cells.forEach((cl, ci) => {
    const row = [res.classes[ci].key + (res.classes[ci].hr ? ' ' + res.classes[ci].hr : '')];
    DAYS.forEach((d, di) => { for (let p = 0; p < res.periods[di]; p++) row.push(cellText(cl[di][p], false)); });
    all.push(row);
  });
  all.push([]);
  res.tcells.forEach((tc, ti) => {
    const row = [res.teacherNames[ti]];
    DAYS.forEach((d, di) => { for (let p = 0; p < res.periods[di]; p++) row.push(tc[di][p].map(x => x.text).join(' / ')); });
    all.push(row);
  });
  const wsAll = XLSX.utils.aoa_to_sheet(all); wsAll['!cols'] = [{ wch: 12 }].concat(Array(header35.length - 1).fill({ wch: 8 }));
  XLSX.utils.book_append_sheet(wb, wsAll, '전체표');
  // 학급별
  const cls = [];
  res.cells.forEach((cl, ci) => {
    cls.push([res.classes[ci].key + '반' + (res.classes[ci].hr ? ' (담임 ' + res.classes[ci].hr + ')' : '')]);
    cls.push(['교시'].concat(DAYS));
    for (let p = 0; p < MAXP; p++) cls.push([p + 1].concat(DAYS.map((d, di) => p < res.periods[di] ? cellText(cl[di][p], true) : '')));
    cls.push([]);
  });
  const wsC = XLSX.utils.aoa_to_sheet(cls); wsC['!cols'] = [{ wch: 8 }].concat(Array(5).fill({ wch: 30 }));
  XLSX.utils.book_append_sheet(wb, wsC, '학급별');
  // 교사별
  const tch = [];
  res.tcells.forEach((tc, ti) => {
    const l = res.loads[ti];
    tch.push([res.teacherNames[ti] + ' (' + l.n + '/' + (l.max >= 99 ? '-' : l.max) + '시수)']);
    tch.push(['교시'].concat(DAYS));
    for (let p = 0; p < MAXP; p++) tch.push([p + 1].concat(DAYS.map((d, di) => p < res.periods[di] ? tc[di][p].map(x => x.text).join(' / ') : '')));
    tch.push([]);
  });
  const wsT = XLSX.utils.aoa_to_sheet(tch); wsT['!cols'] = [{ wch: 8 }].concat(Array(5).fill({ wch: 18 }));
  XLSX.utils.book_append_sheet(wb, wsT, '교사별');
  // 점검
  const chk = [['구분', '내용']]; res.issues.forEach(i => chk.push([i.level === 'err' ? '오류' : '주의', i.msg]));
  if (chk.length === 1) chk.push(['정상', '확인된 문제가 없습니다.']);
  const wsK = XLSX.utils.aoa_to_sheet(chk); wsK['!cols'] = [{ wch: 8 }, { wch: 110 }];
  XLSX.utils.book_append_sheet(wb, wsK, '점검결과');
  return wb;
}

  const label = x => { const i = x.text.indexOf(' '); return i < 0 ? x.text : x.text.slice(i + 1); };
  const tRow = (ti, mode, lead) => {
    const s = slots((d, p) => { const arr = res.tcells[ti][d][p]; if (!arr.length) return '';

function tableXml(rows, W, nP, cuts, borders) {
  cuts = cuts || new Set(); borders = borders || makeBorders();
  const usable = PAGE.w - PAGE.left - PAGE.right - 60;
  const wGroup = Math.round(4 * MM), wName = Math.round(10.5 * MM), wSum = Math.round(7 * MM);
  const wP = Math.floor((usable - wGroup - wName - wSum) / nP);
  const colW = [wGroup, wName].concat(Array(nP).fill(wP), [wSum]);
  const H = Math.round(6.2 * MM);

  const occ = rows.map(() => Array(W).fill(false));

  rows.forEach((r, ri) => {

      for (let a = 0; a < c.rs; a++) for (let b = 0; b < c.cs; b++) if (occ[ri + a]) occ[ri + a][col + b] = true;
      const w = colW.slice(col, col + c.cs).reduce((s, v) => s + v, 0);
      const ps = (c.lines || [c.text]).map(t => para(t === '' ? null : t, c.cp, PP.center)).join('');
      // 선 굵기: 표 바깥·묶음 경계(가로) = 2단계, 요일 경계(세로) = 1단계, 나머지 = 0
      const L = col === 0 ? 2 : cuts.has(col) ? 1 : 0, R = col + c.cs === W ? 2 : cuts.has(col + c.cs) ? 1 : 0;
      const T = (ri === 0 || r.blockStart) ? 2 : 0, B = (ri + c.rs >= rows.length || (rows[ri + c.rs] && rows[ri + c.rs].blockStart)) ? 2 : 0;

}

function sectionXml(res, model, title, sub, borders) {
  const { rows, W, nP, cuts } = buildRows(res, model);
  return XML + `<hs:sec ${NS}>` +
    `<hp:p id="0" paraPrIDRef="${PP.center}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${CP.title}">${secPr()}<hp:t>${esc(title)}</hp:t></hp:run></hp:p>` +

function slotsToText(set, periods) {
  const out = [];
  for (let d = 0; d < 5; d++) {
    let p = 0;
    while (p < periods[d]) {
      if (!set.has(d * 20 + p)) { p++; continue; }
      let q = p; while (q + 1 < periods[d] && set.has(d * 20 + q + 1)) q++;
      out.push(TT.DAYS[d] + (q > p ? (p + 1) + '-' + (q + 1) : (p + 1))); p = q + 1;
    }
  }
  return out.join(', ');
}

    try {
      const wb = window.XLSX.read(rd.result, { type: 'array' }); const r = TTX.workbookToModel(window.XLSX, wb);
      if (!r.found) { toast(r.notes[0]); return; }
      model = normalize(r.model); syncAuto(); commit(); result = null; isSample = false; save(); refreshMeta(); stale = false;
      const P = TT.compile(model); const msg = `엑셀을 불러왔어요. 교과 ${model.subjects.length}개, 교사 ${model.teachers.length}명, 학급 ${P.nC}개.`;
      tab = 'check'; render(); toast(msg + (r.notes.length ? ' (' + r.notes.length + '개 시트는 찾지 못했어요)' : ''));
    } catch (err) { toast('엑셀을 읽지 못했어요: ' + err.message); }
  };
  rd.readAsArrayBuffer(f); e.target.value = '';
}

/* ───────── 틀 ───────── */
const TABS = [['basic', '기본 설정', viewBasic], ['subjects', '교과와 분반', viewSubjects], ['teachers', '교사', viewTeachers], ['assign', '교사 배정', viewAssign], ['fixed', '고정 시간', viewFixed], ['check', '점검', viewCheck], ['result', '시간표', viewResult]];
function render() {
  const nav = $('#tabs'); nav.innerHTML = '';
  TABS.forEach(([id, label], i) => nav.append(h('button', { type: 'button', role: 'tab', 'aria-selected': tab === id ? 'true' : 'false', onclick: () => { tab = id; render(); } }, h('span', { class: 'n' }, i + 1), label, id === 'check' ? h('span', { id: 'badge-check', class: 'badge', style: 'display:none' }) : null)));
  const view = $('#view'); view.innerHTML = '';
  if (isSample) view.append(h('div', { class: 'banner' }, '예시 데이터가 들어 있습니다. 가상의 학교와 가상의 교사 이름으로 만든 연습용 설정이에요. 우리 학교 내용으로 바꾸려면 각 탭에서 직접 고치거나 [기본 설정]에서 엑셀을 올리세요.'));
  const t = TABS.find(x => x[0] === tab); view.append(t[2]());
  refreshMeta(); if (tab === 'result') { renderResultBody(); if (!result && !busy && model.classCounts.some(n => parseInt(n) > 0)) runGenerate(false); }
}

function init() {
  model = loadSaved(); if (!model) { model = window.buildSample(TT); isSample = true; } else if (JSON.stringify(model) === JSON.stringify(normalize(window.buildSample(TT)))) isSample = true;
  lastSnap = snap();
  const hb = $('#hist'); if (hb) hb.append(
    h('button', { type: 'button', id: 'btn-undo', class: 'btn sm', onclick: undo, 'aria-label': '되돌리기' }, '↶ 되돌리기'),
    h('button', { type: 'button', id: 'btn-redo', class: 'btn sm', onclick: redo, 'aria-label': '다시 실행' }, '↷ 다시 실행'));
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const t = e.target; if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['checkbox', 'radio', 'button'].includes(t.type)))) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); } else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  });
  refreshDatalists(); render(); updateHist();
  if (!window.XLSX) { /* 엑셀 도구 로딩 실패는 버튼을 누를 때 안내 */ }
  runGenerate(false);
}
window.addEventListener('DOMContentLoaded', init);
})();

</script>
